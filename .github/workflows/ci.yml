name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Report dependency advisories
        if: always()
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const report = require(process.argv[1]);
            console.log("AUDIT_SUMMARY", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log("ADVISORY", JSON.stringify({
                name,
                severity: item.severity,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: (item.via ?? []).map(v => typeof v === "string" ? v : ({
                  name: v.name, title: v.title, url: v.url, range: v.range
                }))
              }));
            }
          ' "$RUNNER_TEMP/npm-audit.json"

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci
