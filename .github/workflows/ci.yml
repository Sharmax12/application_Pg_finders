name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile
        if: github.ref_name != 'main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already consistent."
            exit 0
          fi
          git commit -m "chore: refresh npm lockfile"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Report dependency advisories
        if: always()
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const report = require(process.argv[1]);
            console.log("AUDIT_SUMMARY", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log("ADVISORY", JSON.stringify({
                name,
                severity: item.severity,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: (item.via ?? []).map(v => typeof v === "string" ? v : ({
                  name: v.name, title: v.title, url: v.url, range: v.range
                }))
              }));
            }
          ' "$RUNNER_TEMP/npm-audit.json"

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci
